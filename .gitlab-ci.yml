include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages: [test]

erp:test:
  stage: test
  image: elixir:1.17
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    MIX_ENV: test
    POSTGRES_USER: kubo_root
    POSTGRES_PASSWORD: kubo_root_ci
    POSTGRES_DB: postgres
    TEST_DB_HOST: postgres
    TEST_DB_NAME: kubo_erp_test
    TEST_DB_USER: kubo_erp
    TEST_DB_PASSWORD: kubo_erp_ci
  cache:
    key: erp-deps
    paths: [deps, _build]
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
    - until PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c 'select 1' >/dev/null 2>&1; do sleep 1; done
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
    - mix compile
    # El rol de la aplicacion no es superusuario: los superusuarios ignoran RLS
    # (incluso con FORCE) y la prueba de aislamiento dejaria de probar algo.
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE ROLE $TEST_DB_USER LOGIN PASSWORD '$TEST_DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE"
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE $TEST_DB_NAME OWNER $TEST_DB_USER ENCODING 'UTF8'"
  script:
    - mix ecto.migrate
    - mix test
